{% extends "base.html" %}

{% block title %}Edit Product - {{ product.name }}{% endblock %}

{% block content %}
<div class="py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Product</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('edit_product', id=product.id) }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="sku" class="form-label">SKU <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="sku" name="sku" required 
                                       value="{{ product.sku }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Product Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required 
                                       value="{{ product.name }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ product.description or '' }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Category</label>
                                <input type="text" class="form-control" id="category" name="category" 
                                       value="{{ product.category or '' }}" list="categories">
                                <datalist id="categories">
                                    <option value="Electronics">
                                    <option value="Furniture">
                                    <option value="Office Supplies">
                                    <option value="Accessories">
                                </datalist>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplier" class="form-label">Supplier</label>
                                <select class="form-select" id="supplier" name="supplier">
                                    <option value="">Select Supplier</option>
                                    {% for supplier in suppliers %}
                                        <option value="{{ supplier.name }}" {% if supplier.name == product.supplier %}selected{% endif %}>
                                            {{ supplier.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label for="unit_price" class="form-label">Unit Price (Tsh) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" 
                                       required min="0" value="{{ product.unit_price }}">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="cost_price" class="form-label">Cost Price (Tsh) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="cost_price" name="cost_price" 
                                       required min="0" value="{{ product.cost_price }}">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="quantity" class="form-label">Current Quantity</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" 
                                       value="{{ product.quantity }}" disabled>
                                <small class="text-muted">Use Stock In/Out to change</small>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" name="location" 
                                       value="{{ product.location or '' }}">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reorder_level" class="form-label">Reorder Level</label>
                                <input type="number" class="form-control" id="reorder_level" name="reorder_level" 
                                       min="0" value="{{ product.reorder_level }}">
                                <small class="text-muted">Alert when stock falls below this level</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="reorder_quantity" class="form-label">Reorder Quantity</label>
                                <input type="number" class="form-control" id="reorder_quantity" name="reorder_quantity" 
                                       min="0" value="{{ product.reorder_quantity }}">
                                <small class="text-muted">Suggested quantity to order</small>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('products') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Update Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
